name: Build and Deploy Lambda

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: |
          bash mvnw clean package -DskipTests

      - name: Find Lambda JAR
        run: |
          echo "JAR files created:"
          find target -maxdepth 1 -type f -name "*.jar" -print

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          JAR_FILE=$(find target -maxdepth 1 -type f -name "*.jar" | grep -v ".original" | head -n 1)

          echo "Deploying JAR:"
          echo "$JAR_FILE"

          aws lambda update-function-code \
            --function-name java-aws-services \
            --zip-file "fileb://$JAR_FILE"

      - name: Verify deployment
        run: |
          aws lambda get-function-configuration \
            --function-name java-aws-services \
            --query '{
              FunctionName:FunctionName,
              Runtime:Runtime,
              Handler:Handler,
              LastUpdateStatus:LastUpdateStatus
            }' \
            --output table
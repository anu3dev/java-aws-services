name: Build and Deploy Lambda

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build Spring Boot application
      - name: Build with Maven
        run: |
          bash mvnw clean package -DskipTests

      # 4. Find the shaded JAR
      - name: Find Lambda JAR
        run: |
          echo "JAR files created:"
          find target -maxdepth 1 -type f -name "*.jar" -print

      # 5. Create Lambda deployment ZIP
      - name: Create Lambda deployment package
        run: |
          mkdir lambda-package

          JAR_FILE=$(find target -maxdepth 1 -type f -name "*.jar" | grep -v ".original" | head -n 1)

          echo "Using JAR:"
          echo "$JAR_FILE"

          cp "$JAR_FILE" lambda-package/application.jar

          cd lambda-package
          zip ../lambda.zip application.jar

      # 6. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 7. Deploy to AWS Lambda
      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name java-aws-services-lambda \
            --zip-file fileb://lambda.zip

      # 8. Show deployment result
      - name: Verify deployment
        run: |
          aws lambda get-function \
            --function-name java-aws-services-lambda \
            --query 'Configuration.[FunctionName,LastModified,LastUpdateStatus]' \
            --output table